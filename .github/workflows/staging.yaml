name: Staging Build

on:
  push:
    branches: 
      - "staging"

jobs:
  build_staging:
    runs-on: ubuntu-latest

    steps:
      - name: 🗂️ Checkout Code
        uses: actions/checkout@v6

      - name: ☕ Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔵 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: ⬇️ Install Dependencies
        run: flutter pub get

      - name: 🧐 Run Analyze
        run: flutter analyze

      - name: 🧪 Run Tests
        run: flutter test

      - name: 🗃️ Build APK
        run: flutter build apk --profile --no-shrink --build-name=1.0.0 --build-number=1

      - name: ⬆️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7